name: Security unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app tests/security

      - name: Run security unit tests
        run: python -m unittest discover -s tests/security -p "test_*.py" -v
      - name: Run mocked AWS security evaluation
        run: python app/evaluate_offline.py > offline-evaluation.json

      - name: Retain evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: rag-offline-evaluation
          path: offline-evaluation.json
          retention-days: 14

      - name: Check out SOAR workbench source
        uses: actions/checkout@v6
        with:
          repository: SushiBear21/aws-security-response-lab
          ref: 7018def69bf97feda639e76cfc880e4f92f8b0f0
          path: .companions/response
          persist-credentials: false

      - name: Check out Control Tower source
        uses: actions/checkout@v6
        with:
          repository: SushiBear21/agentic-security-workflow
          ref: a7f5c38ad62f14eddb298ca546abd76ddd6a82f8
          path: .companions/tower
          persist-credentials: false

      - name: Run defensive AI incident response exercise
        run: >-
          python -m app.incident_scenario --output ai-incident-case.json
          --response-lab .companions/response --control-tower .companions/tower

      - name: Retain AI incident case evidence
        uses: actions/upload-artifact@v4
        with:
          name: rag-ai-incident-case
          path: ai-incident-case.json
          if-no-files-found: error
          retention-days: 14
